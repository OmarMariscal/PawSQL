version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: postgres_db
    restart: always
    environment:
      POSTGRES_DB: paw_db
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: greñuditos
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db-init:/docker-entrypoint-initdb.d
    networks:
      - PawSQL_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: spring_backend
    restart: always
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/paw_db
      SPRING_DATASOURCE_USERNAME: admin
      SPRING_DATASOURCE_PASSWORD: greñuditos
    depends_on:
      - db
    networks:
      - PawSQL_network

  frontend: 
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: PawSQL_Frontend
    restart: always
    ports: 
      - "5173:5173"
    depends_on:
      - backend
    networks:
      - PawSQL_network

volumes:
  postgres_data:
    name: paw_data

networks:
  PawSQL_network:
    driver: bridge
  